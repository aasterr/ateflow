# Fly.io deployment. First time:
#   fly launch --no-deploy    (creates the app, keep this file when asked)
#   fly volumes create ateflow_data --size 1
#   fly deploy
app = "ateflow"
primary_region = "ams"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "ateflow_data"
  destination = "/data"
