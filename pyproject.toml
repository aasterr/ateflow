[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ateflow"
version = "0.1.0"
description = "Causal effect estimation from a declarative DAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ateflow = "ateflow.cli:main"

[tool.setuptools.packages.find]
include = ["ateflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
